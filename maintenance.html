<!DOCTYPE html>
<!--
  MAINTENANCE PAGE — shown to every visitor while maintenance mode is on.

  It is a standalone page on purpose: it doesn't load styles.css, app.js,
  products.js or any Shopify code, so nothing from the storefront runs or
  shows. It only borrows the brand's fonts, logo and favicons.

  Maintenance mode itself is ONE route in vercel.json (the entry whose
  "dest" is "/maintenance.html"). Remove that entry to bring the storefront
  back. See MAINTENANCE.md for the exact steps.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PawHaul — We're Making Improvements</title>
<meta name="description" content="We're working behind the scenes to improve your PawHaul experience. We'll be back with updates soon.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/fredoka-one-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-latin-var.woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Fredoka One';
    src: url('/fonts/fredoka-one-latin.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Nunito';
    src: url('/fonts/nunito-latin-var.woff2') format('woff2');
    font-weight: 200 1000;
    font-display: swap;
  }

  :root {
    --orange: #E8630A;
    --navy: #1a1a2e;
    --navy-2: #16213e;
    --navy-deep: #0d0d1a;
    --font-display: 'Fredoka One', 'Trebuchet MS', system-ui, sans-serif;
    --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    background-color: var(--navy);
    /* Soft warm glow up top, deepening to navy at the bottom. */
    background-image:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(232, 99, 10, 0.16), transparent 70%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-deep) 100%);
  }

  /* A few faint paw prints scattered at the edges — decoration only. */
  .paws {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .paws svg {
    position: absolute;
    fill: #fff;
    opacity: 0.045;
  }

  main {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(48px + env(safe-area-inset-top)) 24px 32px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }
  .brand img {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    display: block;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 0 4px rgba(255, 255, 255, 0.06);
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1;
    letter-spacing: 0.3px;
  }
  .wordmark span { color: var(--orange); }

  .rule {
    width: 48px;
    height: 3px;
    margin: 0 auto 28px;
    border-radius: 3px;
    background: var(--orange);
  }

  h1 {
    margin: 0 0 18px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1.12;
    color: #fff;
  }

  .message {
    margin: 0 auto 26px;
    max-width: 30em;
    font-size: clamp(16px, 2.2vw, 18px);
    font-weight: 600;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.82);
  }

  .thanks {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.55);
  }

  footer {
    position: relative;
    padding: 20px 24px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
  }
  footer span { color: rgba(232, 99, 10, 0.75); }

  /* Narrow screens: keep the two inner paws from sitting behind the text. */
  @media (max-width: 700px) {
    .paws svg:nth-child(2), .paws svg:nth-child(4) { display: none; }
  }

  @media (max-width: 480px) {
    .brand { margin-bottom: 32px; }
    .brand img { width: 76px; height: 76px; }
    .wordmark { font-size: 26px; }
  }
</style>
</head>
<body>
  <div class="paws" aria-hidden="true">
    <svg viewBox="0 0 100 100" style="width:120px;top:9%;left:6%;transform:rotate(-18deg)"><ellipse cx="50" cy="67" rx="20" ry="16"/><ellipse cx="27" cy="47" rx="9" ry="12"/><ellipse cx="42" cy="35" rx="9" ry="12"/><ellipse cx="58" cy="35" rx="9" ry="12"/><ellipse cx="73" cy="47" rx="9" ry="12"/></svg>
    <svg viewBox="0 0 100 100" style="width:84px;top:30%;left:16%;transform:rotate(-8deg)"><ellipse cx="50" cy="67" rx="20" ry="16"/><ellipse cx="27" cy="47" rx="9" ry="12"/><ellipse cx="42" cy="35" rx="9" ry="12"/><ellipse cx="58" cy="35" rx="9" ry="12"/><ellipse cx="73" cy="47" rx="9" ry="12"/></svg>
    <svg viewBox="0 0 100 100" style="width:140px;bottom:10%;right:5%;transform:rotate(22deg)"><ellipse cx="50" cy="67" rx="20" ry="16"/><ellipse cx="27" cy="47" rx="9" ry="12"/><ellipse cx="42" cy="35" rx="9" ry="12"/><ellipse cx="58" cy="35" rx="9" ry="12"/><ellipse cx="73" cy="47" rx="9" ry="12"/></svg>
    <svg viewBox="0 0 100 100" style="width:92px;bottom:32%;right:15%;transform:rotate(12deg)"><ellipse cx="50" cy="67" rx="20" ry="16"/><ellipse cx="27" cy="47" rx="9" ry="12"/><ellipse cx="42" cy="35" rx="9" ry="12"/><ellipse cx="58" cy="35" rx="9" ry="12"/><ellipse cx="73" cy="47" rx="9" ry="12"/></svg>
  </div>

  <main>
    <div class="card">
      <div class="brand">
        <img src="/images/brand/logo-circle-simple.png" width="88" height="88" alt="PawHaul logo">
        <div class="wordmark">Paw<span>Haul</span></div>
      </div>
      <div class="rule" aria-hidden="true"></div>
      <h1>We're Making Improvements</h1>
      <p class="message">We're working behind the scenes to improve your PawHaul experience. We'll be back with updates soon.</p>
      <p class="thanks">Thank you for your patience.</p>
    </div>
  </main>

  <footer>© 2026 <span>PawHaul</span></footer>
</body>
</html>
